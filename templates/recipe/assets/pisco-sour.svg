<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f0e2"/>
      <stop offset="1" stop-color="#eadcc6"/>
    </linearGradient>
    <linearGradient id="drink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d77d"/>
      <stop offset="1" stop-color="#d6b452"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d8e0dc" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5b4930" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5b4930" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="500" rx="24" fill="url(#bg)"/>
  <circle cx="92" cy="96" r="38" fill="#d9e0c8" opacity="0.7"/>
  <circle cx="410" cy="118" r="58" fill="#e7d6b4" opacity="0.65"/>
  <path d="M28 414 H472" stroke="#cbb28d" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Shadow -->
  <ellipse cx="250" cy="416" rx="145" ry="26" fill="url(#shadow)"/>

  <!-- Coupe glass -->
  <path d="M126 190 C134 252 180 286 250 286 C320 286 366 252 374 190 Z"
        fill="url(#glass)" stroke="#cdd7d2" stroke-width="3"/>
  <path d="M137 199 C146 252 186 276 250 276 C314 276 354 252 363 199 Z"
        fill="url(#drink)" opacity="0.95"/>

  <!-- Foam -->
  <path d="M136 197 C168 174 208 168 250 174 C292 168 332 174 364 197 C356 214 314 228 250 228 C186 228 144 214 136 197 Z"
        fill="#fffaf0"/>
  <path d="M150 198 C184 184 218 182 250 187 C282 182 318 184 350 198"
        fill="none" stroke="#eadcc4" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- Bitters drops -->
  <g fill="#7d3325">
    <circle cx="222" cy="197" r="7"/>
    <circle cx="248" cy="191" r="7"/>
    <circle cx="274" cy="197" r="7"/>
    <circle cx="236" cy="207" r="4" opacity="0.85"/>
    <circle cx="262" cy="207" r="4" opacity="0.85"/>
  </g>

  <!-- Stem and base -->
  <path d="M244 286 L240 376 H260 L256 286 Z" fill="url(#glass)" stroke="#cdd7d2" stroke-width="3"/>
  <path d="M186 398 C186 382 212 376 250 376 C288 376 314 382 314 398 Z"
        fill="url(#glass)" stroke="#cdd7d2" stroke-width="3"/>
  <ellipse cx="250" cy="398" rx="64" ry="9" fill="#eef2ed" stroke="#cdd7d2" stroke-width="3"/>

  <!-- Glass highlights -->
  <path d="M154 202 C160 238 186 258 218 266" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <path d="M248 290 L246 364" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- Lime wheel -->
  <g transform="translate(386 196)">
    <circle r="35" fill="#8caf52"/>
    <circle r="28" fill="#b9d775"/>
    <g stroke="#f4f5df" stroke-width="3">
      <path d="M-22 0 H22 M0 -22 V22 M-15 -15 L15 15 M15 -15 L-15 15"/>
    </g>
    <circle r="5" fill="#f4f5df"/>
  </g>

  <!-- Small lime wedge on the rim -->
  <path d="M142 208 A28 28 0 0 1 190 206 L166 220 Z" fill="#9fbe60" stroke="#7f9d43" stroke-width="2"/>
</svg>
