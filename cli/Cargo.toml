[package]
name = "tome-md"
version.workspace = true
edition.workspace = true
description = "Compile Markdown to PDF through Typst"
license.workspace = true

[[bin]]
name = "tome"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tome-md-core = { path = "../core" }

[lints]
workspace = true
