name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag with workspace version
        run: |
          version=$(cargo metadata --no-deps --offline --format-version 1 \
            | jq -r '.packages[] | select(.name == "tome-md") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version v$version"
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Build
        run: cargo build --locked --release -p tome-md --target ${{ matrix.target }}
      - name: Collect binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/tome${{ matrix.ext }}" \
             "dist/tome-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v7
        with:
          name: tome-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Add license and checksums
        working-directory: dist
        run: |
          cp ../LICENSE LICENSE
          sha256sum tome-* > SHA256SUMS
      - name: Show assets
        run: ls -l dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
