name: Release

on:
  push:
    tags:
      - "v*"
  # Re-release an existing tag, or retry a tag whose build failed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.tag || github.ref }}
      - name: Compare tag with workspace version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --offline --format-version 1 \
            | jq -r '.packages[] | select(.name == "tome-md") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match version v$version"
            exit 1
          fi

          previous=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n1)
          if [ -n "$previous" ] \
            && [ "$(printf '%s\n%s\n' "$previous" "$TAG" | sort -V | tail -n1)" != "$TAG" ]; then
            echo "::error::$TAG is older than the latest tag $previous"
            exit 1
          fi
          echo "previous tag: ${previous:-none}"

  build:
    name: ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build Linux binaries on Ubuntu 22.04 (glibc 2.35) instead of the
          # moving latest image, so they run on older Linux distributions too.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/setup-rust
      - name: Build
        run: cargo build --locked --release -p tome-md --target ${{ matrix.target }}
      - name: Collect binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/tome${{ matrix.ext }}" \
             "dist/tome-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v7
        with:
          name: tome-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Add license and checksums
        working-directory: dist
        run: |
          cp ../LICENSE LICENSE
          sha256sum tome-* > SHA256SUMS
      - name: Show assets
        run: ls -l dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
