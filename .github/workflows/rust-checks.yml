name: Rust checks

on:
  push:
    paths:
      - "**/*.rs"
      - "**/*.typ"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/actions/**"
      - ".github/workflows/rust-checks.yml"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/*.typ"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/actions/**"
      - ".github/workflows/rust-checks.yml"

permissions:
  contents: read

concurrency:
  group: rust-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: false
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Run tests
        run: cargo test --workspace --locked

  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build
        run: cargo build --workspace --locked --release
