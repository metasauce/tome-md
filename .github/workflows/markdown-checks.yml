name: Markdown checks

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".pre-commit-config.yaml"
      - ".github/workflows/markdown-checks.yml"
  pull_request:
    paths:
      - "**/*.md"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".pre-commit-config.yaml"
      - ".github/workflows/markdown-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier:
    name: Prettier
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Markdown formatting
        run: npx --yes prettier@3.9.10 --check "**/*.md"
